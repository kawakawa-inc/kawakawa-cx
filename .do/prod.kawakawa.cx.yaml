# DigitalOcean App Platform app spec for prod (kawakawa.cx).
#
# Reference: https://docs.digitalocean.com/products/app-platform/reference/app-spec
#
# Bindable variables (`${APP_URL}`, `${kawa-db.DATABASE_URL}` and friends) are
# resolved by the platform at runtime and are documented separately:
# https://docs.digitalocean.com/products/app-platform/how-to/use-environment-variables/#use-bindable-variables
#
# Prefer a bindable variable over a hardcoded value wherever one exists — a
# literal is a second copy that has to be kept in step by hand, and config drift
# here fails quietly rather than loudly.
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
databases:
  - cluster_name: prod-db-kawakawa-cx
    db_name: kawa-db
    db_user: kawa-db
    engine: PG
    name: kawa-db
    production: true
    version: '17'
domains:
  - domain: kawakawa.cx
    type: PRIMARY
    zone: kawakawa.cx
ingress:
  rules:
    - component:
        name: kawa-api
      match:
        path:
          prefix: /api
    - component:
        name: kawa-web
      match:
        path:
          prefix: /
jobs:
  - envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${kawa-db.DATABASE_URL}
    image:
      registry: ghcr.io
      registry_type: GHCR
      repository: keenan-v1/kawakawa-api
      tag: main
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    kind: PRE_DEPLOY
    log_destinations:
      - name: prod-kawakawa-cx
        open_search:
          basic_auth:
            user: doadmin
          cluster_name: db-opensearch-kawakawa-cx
          index_name: logs-kawakawa-cx
    name: db-migrate
    run_command: node apps/api/dist/scripts/db-migrate.js
  - envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${kawa-db.DATABASE_URL}
    image:
      registry: ghcr.io
      registry_type: GHCR
      repository: keenan-v1/kawakawa-api
      tag: main
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    kind: POST_DEPLOY
    log_destinations:
      - name: prod-kawakawa-cx
        open_search:
          basic_auth:
            user: doadmin
          cluster_name: db-opensearch-kawakawa-cx
          index_name: logs-kawakawa-cx
    name: db-init
    run_command: node apps/api/dist/scripts/db-init-idempotent.js
  - envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${kawa-db.DATABASE_URL}
    image:
      registry: ghcr.io
      registry_type: GHCR
      repository: keenan-v1/kawakawa-api
      tag: main
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    kind: POST_DEPLOY
    log_destinations:
      - name: prod-kawakawa-cx
        open_search:
          basic_auth:
            user: doadmin
          cluster_name: db-opensearch-kawakawa-cx
          index_name: logs-kawakawa-cx
    name: run-batch
    run_command: node apps/api/dist/scripts/run-batch.js
name: prod-kawakawa-cx
region: nyc
services:
  - envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${kawa-db.DATABASE_URL}
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: EV[1:jgc1AKobvhloyvAZ/6NKhmoPKYGfw03H:UzWCBtfNeYgVXlUKJA4vW5xKQ43XagmdN3IhWEcnFADCV8CgeLTkK+uEsoX7T3+4]
      - key: PORT
        scope: RUN_TIME
        value: '3000'
      # Public origin of the app, used by the CSRF origin check
      # (apps/api/src/middleware/csrf.ts).
      #
      # `${APP_URL}` is a DigitalOcean bindable variable resolving to the PRIMARY
      # domain in http(s) form, injected at runtime. Deliberately not hardcoded to
      # https://kawakawa.cx: a literal would be a second copy of the domain that
      # must be kept in step with `domains` above, and if it ever drifted the CSRF
      # check would silently fall back to the weaker Host comparison rather than
      # failing loudly.
      # https://docs.digitalocean.com/products/app-platform/how-to/use-environment-variables/#app-wide-variables
      - key: APP_ORIGIN
        scope: RUN_TIME
        value: ${APP_URL}
    http_port: 3000
    image:
      registry: ghcr.io
      registry_type: GHCR
      repository: keenan-v1/kawakawa-api
      tag: main
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    log_destinations:
      - name: prod-kawakawa-cx
        open_search:
          basic_auth:
            user: doadmin
          cluster_name: db-opensearch-kawakawa-cx
          index_name: logs-kawakawa-cx
    name: kawa-api
  - http_port: 80
    image:
      registry: ghcr.io
      registry_type: GHCR
      repository: keenan-v1/kawakawa-web
      tag: main
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    log_destinations:
      - name: prod-kawakawa-cx
        open_search:
          basic_auth:
            user: doadmin
          cluster_name: db-opensearch-kawakawa-cx
          index_name: logs-kawakawa-cx
    name: kawa-web
workers:
  - envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${kawa-db.DATABASE_URL}
    image:
      registry: ghcr.io
      registry_type: GHCR
      repository: keenan-v1/kawakawa-bot
      tag: main
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    log_destinations:
      - name: prod-kawakawa-cx
        open_search:
          basic_auth:
            user: doadmin
          cluster_name: db-opensearch-kawakawa-cx
          index_name: logs-kawakawa-cx
    name: kawa-bot
  - envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${kawa-db.DATABASE_URL}
      # FIO_API_KEY must be set in the DigitalOcean console (SECRET) — used
      # by the global sync jobs (commodities/locations/stations). Per-user
      # syncs use each user's own FIO key from userSettings.
    image:
      registry: ghcr.io
      registry_type: GHCR
      repository: keenan-v1/kawakawa-sync-worker
      tag: main
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    log_destinations:
      - name: prod-kawakawa-cx
        open_search:
          basic_auth:
            user: doadmin
          cluster_name: db-opensearch-kawakawa-cx
          index_name: logs-kawakawa-cx
    name: kawa-sync-worker
