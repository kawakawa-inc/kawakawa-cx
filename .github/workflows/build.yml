name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/kawakawa

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - app: api
            context: .
            dockerfile: apps/api/Dockerfile
          - app: bot
            context: .
            dockerfile: apps/bot/Dockerfile
          - app: web
            context: .
            dockerfile: apps/web/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_SHA=${{ github.sha }}

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Set app name and spec file
        id: app
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            APP_NAME="prod-kawakawa-cx"
            echo "spec_file=.do/prod.kawakawa.cx.yaml" >> $GITHUB_OUTPUT
          else
            APP_NAME="dev-kawakawa-cx"
            echo "spec_file=.do/dev.kawakawa.cx.yaml" >> $GITHUB_OUTPUT
          fi
          echo "name=$APP_NAME" >> $GITHUB_OUTPUT

          # Look up app UUID by name
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | grep "$APP_NAME" | awk '{print $1}')
          if [ -z "$APP_ID" ]; then
            echo "Error: Could not find app with name $APP_NAME"
            exit 1
          fi
          echo "id=$APP_ID" >> $GITHUB_OUTPUT
          echo "Found app $APP_NAME with ID: $APP_ID"

      - name: Update app spec with image tags
        run: |
          export IMAGE_TAG="${{ github.sha }}"
          IMAGE_TAG="${IMAGE_TAG:0:7}"
          export IMAGE_TAG
          export REGISTRY="${{ env.REGISTRY }}"
          export IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"

          # Install yq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          # Update API service
          yq -i '(.services[] | select(.name == "kawa-api")).image.registry_type = "GHCR"' ${{ steps.app.outputs.spec_file }}
          yq -i '(.services[] | select(.name == "kawa-api")).image.registry = env(REGISTRY)' ${{ steps.app.outputs.spec_file }}
          yq -i '(.services[] | select(.name == "kawa-api")).image.repository = env(IMAGE_PREFIX) + "-api"' ${{ steps.app.outputs.spec_file }}
          yq -i '(.services[] | select(.name == "kawa-api")).image.tag = strenv(IMAGE_TAG)' ${{ steps.app.outputs.spec_file }}

          # Update Bot worker
          yq -i '(.workers[] | select(.name == "kawa-bot")).image.registry_type = "GHCR"' ${{ steps.app.outputs.spec_file }}
          yq -i '(.workers[] | select(.name == "kawa-bot")).image.registry = env(REGISTRY)' ${{ steps.app.outputs.spec_file }}
          yq -i '(.workers[] | select(.name == "kawa-bot")).image.repository = env(IMAGE_PREFIX) + "-bot"' ${{ steps.app.outputs.spec_file }}
          yq -i '(.workers[] | select(.name == "kawa-bot")).image.tag = strenv(IMAGE_TAG)' ${{ steps.app.outputs.spec_file }}

          # Update Web service
          yq -i '(.services[] | select(.name == "kawa-web")).image.registry_type = "GHCR"' ${{ steps.app.outputs.spec_file }}
          yq -i '(.services[] | select(.name == "kawa-web")).image.registry = env(REGISTRY)' ${{ steps.app.outputs.spec_file }}
          yq -i '(.services[] | select(.name == "kawa-web")).image.repository = env(IMAGE_PREFIX) + "-web"' ${{ steps.app.outputs.spec_file }}
          yq -i '(.services[] | select(.name == "kawa-web")).image.tag = strenv(IMAGE_TAG)' ${{ steps.app.outputs.spec_file }}

          # Update jobs to use API image
          yq -i '(.jobs[]).image.registry_type = "GHCR"' ${{ steps.app.outputs.spec_file }}
          yq -i '(.jobs[]).image.registry = env(REGISTRY)' ${{ steps.app.outputs.spec_file }}
          yq -i '(.jobs[]).image.repository = env(IMAGE_PREFIX) + "-api"' ${{ steps.app.outputs.spec_file }}
          yq -i '(.jobs[]).image.tag = strenv(IMAGE_TAG)' ${{ steps.app.outputs.spec_file }}

          echo "Updated spec file:"
          cat ${{ steps.app.outputs.spec_file }}

      - name: Deploy to DigitalOcean App Platform
        run: |
          doctl apps update ${{ steps.app.outputs.id }} --spec ${{ steps.app.outputs.spec_file }} --wait

  release:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release tag
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Get PR release notes
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find the merged PR for this commit
          PR_NUMBER=$(gh pr list --state merged --search "${{ github.sha }}" --json number --jq '.[0].number')

          if [ -n "$PR_NUMBER" ]; then
            PR_TITLE=$(gh pr view "$PR_NUMBER" --json title --jq '.title')
            PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body')
            echo "title=$PR_TITLE" >> $GITHUB_OUTPUT

            # Write body to file for multi-line support
            echo "$PR_BODY" > /tmp/release_notes.md
          else
            echo "title=Release ${{ steps.tag.outputs.tag }}" >> $GITHUB_OUTPUT
            echo "No PR found for this commit. See [commit history](https://github.com/${{ github.repository }}/commits/main) for details." > /tmp/release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.pr.outputs.title }}
          body_path: /tmp/release_notes.md
          make_latest: true
