server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Security headers (CSP et al). Note: nginx drops inherited add_header
    # directives in any location that declares its own, so every location
    # below that sets a header re-includes this file.
    include /etc/nginx/security-headers.conf;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached.
    #
    # Vite emits content-hashed asset filenames, so the assets above are safely
    # immutable — but only if the HTML that references them is fresh. A cached
    # index.html pins a browser to an old bundle indefinitely, which is how tabs
    # kept running weeks-old JS across deploys (and kept re-breaking auth in ways
    # that were already fixed). Revalidate on every load.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
        expires off;
    }

    # SPA fallback - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        include /etc/nginx/security-headers.conf;
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
